<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Account Deletion Reproduction Fixture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .danger { border: 1px solid #e88; padding: 20px; max-width: 600px; }
    .modal { border: 1px solid #bbb; padding: 20px; margin-top: 20px; }
    button { padding: 10px 18px; margin-right: 8px; }
  </style>
</head>
<body>
  <section class="danger">
    <h1>Account</h1>
    <h2>Danger Zone</h2>
    <p>Permanently delete your account and all associated data.</p>
    <button id="open-delete">Delete Account</button>
  </section>

  <section class="modal" id="delete-modal" hidden>
    <h2>Delete Account</h2>
    <p>This will permanently delete your account and all your data. This action cannot be undone.</p>
    <label>
      TYPE YOUR EMAIL TO CONFIRM
      <input id="email" type="email" autocomplete="off" />
    </label>
    <p>
      <button id="cancel">Cancel</button>
      <!-- Deliberate reproduction: the final button has no handler. -->
      <button id="confirm">Delete Account</button>
    </p>
  </section>

  <script>
    const modal = document.getElementById('delete-modal');
    document.getElementById('open-delete').addEventListener('click', () => {
      modal.hidden = false;
    });
    document.getElementById('cancel').addEventListener('click', () => {
      modal.hidden = true;
    });
  </script>
</body>
</html>
