<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account deletion flow test harness</title>
</head>
<body>
  <main>
    <h1>Account settings</h1>
    <section aria-labelledby="danger-heading">
      <h2 id="danger-heading">Danger Zone</h2>
      <button id="open-delete" type="button">Delete Account</button>
    </section>

    <section id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <h2 id="modal-title">Delete Account</h2>
      <p>This action cannot be undone.</p>
      <label for="email">Type your email to confirm</label>
      <input id="email" type="email" autocomplete="off" aria-describedby="validation" />
      <p id="validation" role="alert"></p>
      <button id="cancel" type="button">Cancel</button>
      <button id="confirm" type="button" disabled>Delete Account</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const expectedEmail = 'qa-test@example.com';
    const modal = document.querySelector('#delete-modal');
    const openButton = document.querySelector('#open-delete');
    const email = document.querySelector('#email');
    const validation = document.querySelector('#validation');
    const cancelButton = document.querySelector('#cancel');
    const confirmButton = document.querySelector('#confirm');
    const status = document.querySelector('#status');
    let submitting = false;

    function closeModal() {
      modal.hidden = true;
      openButton.focus();
    }

    openButton.addEventListener('click', () => {
      status.textContent = '';
      modal.hidden = false;
      email.focus();
    });

    email.addEventListener('input', () => {
      const matches = email.value.trim().toLowerCase() === expectedEmail;
      confirmButton.disabled = !matches || submitting;
      validation.textContent = matches ? '' : (email.value ? 'Email does not match this account.' : 'Enter your account email.');
    });

    cancelButton.addEventListener('click', closeModal);
    modal.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeModal();
    });

    confirmButton.addEventListener('click', async () => {
      if (submitting || confirmButton.disabled) return;
      submitting = true;
      confirmButton.disabled = true;
      confirmButton.textContent = 'Deleting…';
      validation.textContent = '';

      try {
        // Optional gate used only by the local Playwright harness to inspect
        // the pending state before the mocked API responds.
        if (window.__qaHoldSubmission) await window.__qaHoldSubmission;
        const response = await fetch('/api/account/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim() }),
        });
        if (!response.ok) throw new Error('Deletion request failed. Please try again.');
        status.textContent = 'Account deletion request completed.';
        closeModal();
      } catch (error) {
        validation.textContent = error.message || 'Unable to complete the request. Please try again.';
        submitting = false;
        confirmButton.disabled = false;
        confirmButton.textContent = 'Delete Account';
      }
    });
  </script>
</body>
</html>
